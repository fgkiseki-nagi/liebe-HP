<!-- ===== ページ末尾CTA帯（ページ種別ごとに文言を同期） ===== -->
<section class="cta-band" aria-labelledby="cta-h">
  <div class="container cta-inner">
    <div>
      <p class="eyebrow">{{ctaEyebrow}}</p>
      <h2 id="cta-h">{{ctaHeading}}</h2>
      <p>{{ctaBody}}</p>
    </div>
    <div class="cta-tel">
      <span class="label">{{ctaLabel}}</span>
      <a class="num" href="tel:0166743774" aria-label="電話をかける 0166-74-3774">
        <svg class="icon" aria-hidden="true"><use href="{{root}}assets/icons/sprite.svg#i-phone"/></svg>0166-74-3774
      </a>
      <div class="cta-sub">
        <span>FAX：<span class="tnum">0166-74-3240</span></span>
        <a href="mailto:liebe@aiseikai.care">liebe@aiseikai.care</a>
        <a href="{{root}}{{ctaLinkHref}}">{{ctaLinkLabel}}</a>
      </div>
      <p class="cta-note">新規のご相談はお電話で受け付けます（受付時間はお問い合わせください）。メールは緊急のご相談には使用しないでください。</p>
    </div>
  </div>
</section>
